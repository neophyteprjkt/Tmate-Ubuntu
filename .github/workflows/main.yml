name: "Ubuntu SSH Runner"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup
        shell: bash
        run: |
          set -e
          export TERM=xterm

          wget https://raw.githubusercontent.com/neophyteprjkt/Tmate-Ubuntu/main/dependency.sh
          bash dependency.sh

      - name: Verify SSH
        shell: bash
        run: |
          set -e

          echo "=== SSH ==="
          sudo systemctl status ssh --no-pager || true

          echo "=== Listening ports ==="
          sudo ss -lntp

          echo "=== Runner IP ==="
          hostname -I || true

          echo "=== SSH version ==="
          ssh -V

      - name: Keep runner alive
        shell: bash
        run: |
          echo "Runner is ready."
          echo "Waiting until the workflow timeout..."

          while true; do
            sleep 60
          done
