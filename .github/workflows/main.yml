name: "Ubuntu SSH"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup dependency
        shell: bash
        run: |
          set -e
          export TERM=xterm

          wget -O dependency.sh \
            https://raw.githubusercontent.com/neophyteprjkt/Tmate-Ubuntu/main/dependency.sh

          chmod +x dependency.sh
          bash dependency.sh

      - name: Check environment
        shell: bash
        run: |
          echo "======================================"
          echo " Ubuntu GitHub Actions Runner"
          echo "======================================"

          echo "Hostname:"
          hostname

          echo "User:"
          whoami

          echo "Kernel:"
          uname -a

          echo "IP:"
          hostname -I || true

          echo "======================================"

      - name: Start SSH session
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
