name: "Tmate Ubuntu SSH"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Setup
        shell: bash
        run: |
          set -e
          export TERM=xterm

          wget -O dependency.sh \
            https://raw.githubusercontent.com/neophyteprjkt/Tmate-Ubuntu/main/dependency.sh

          chmod +x dependency.sh
          bash dependency.sh

      - name: Diagnose DNS
        shell: bash
        run: |
          set -x

          echo "=== resolv.conf ==="
          cat /etc/resolv.conf

          echo "=== DNS tools ==="
          sudo apt-get update
          sudo apt-get install -y dnsutils

          echo "=== Google DNS ==="
          nslookup ssh.tmate.io 8.8.8.8 || true

          echo "=== Cloudflare DNS ==="
          nslookup ssh.tmate.io 1.1.1.1 || true

          echo "=== System DNS ==="
          nslookup ssh.tmate.io || true

          echo "=== HTTPS test ==="
          curl -4 -Iv --connect-timeout 10 \
            https://ssh.tmate.io/ || true

      - name: Start tmate
        shell: bash
        run: |
          export TERM=xterm

          sudo bash -c '
            cd
            export TERM=xterm
            tmate -F
          '
